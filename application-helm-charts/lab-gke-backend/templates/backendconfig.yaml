apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Release.Name }}-backend-config
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    type: HTTP
    # Lấy đường dẫn /health từ values.yaml của bạn
    requestPath: {{ .Values.service.healthCheckPath }}
    port: {{ .Values.service.port }}
    # API Node.js của bạn phải trả về 200 OK ở path này