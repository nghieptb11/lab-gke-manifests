apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysql-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: mysql-db
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.service.portName }}
  selector:
    app: mysql-db
